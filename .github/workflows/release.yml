name: release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      repackage:
        description: "Publish a packaging-only .N+1 even though this declared state is released"
        type: boolean
        default: false
      reconcile:
        description: "Set by the nightly reconcile backstop"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    release-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      publish: ${{ steps.ver.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mavericks-shipyard
        uses: Mavergreen/shipyard/.github/actions/install@v1

      - name: Record the toolchain
        run: |
          clang --version
          xcodebuild -version

      - name: Record the pre-build tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh" --record

      - name: Version (YYYYMMDD.N) + publish decision
        id: ver
        env:
          REPACKAGE: ${{ inputs.repackage }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="$(tr -d '[:space:]' < UPSTREAM_VERSION)"
          maxn=0
          for t in $(git tag --list "$base.*"); do
            n="${t##*.}"
            case "$n" in ''|*[!0-9]*) : ;; *) [ "$n" -gt "$maxn" ] && maxn="$n" ;; esac
          done
          ver="$base.$((maxn + 1))"
          pub=no
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REPACKAGE" = true ]; then
              pub=yes
            else
              digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
              answer="$(sh "$SHIPYARD_SCRIPTS/release-needed.sh" --digest "$digest" --version "$ver")"
              echo "release-needed: $answer"
              if [ "$answer" = PUBLISH ]; then pub=yes; fi
            fi
          fi
          printf '%s\n' "$ver" > VERSION
          { echo "ver=$ver"; echo "publish=$pub"; } >> "$GITHUB_OUTPUT"
          echo "version=$ver publish=$pub"

      - name: Ensure this runner can run x86_64 (Rosetta)
        run: |
          set -eu
          arch -x86_64 /usr/bin/true 2>/dev/null \
            || sudo softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true

      - name: Configure (cross, pinned 10.9 SDK, with the updater)
        run: shipyard-cmake --preset cross -DAVXEMU_BUILD_UPDATER=ON

      - name: Build + compat guard
        run: shipyard-cmake --build --preset cross

      - name: Run the repo's tests
        run: sh "$SHIPYARD_SCRIPTS/run-repo-tests.sh" cross

      - name: Locate the build
        run: echo "BUILD=${TMPDIR:-/tmp}/mm-build/$(basename "$PWD")-cross" >> "$GITHUB_ENV"

      - name: Package the .pkg
        run: sh packaging/build-pkg.sh "$BUILD" "${{ steps.ver.outputs.ver }}" "$BUILD/dist/avxemu-${{ steps.ver.outputs.ver }}.pkg"

      - name: The package yields exactly the tested dylib
        run: sh test/extract-test.sh "$BUILD/dist/avxemu-${{ steps.ver.outputs.ver }}.pkg" "$BUILD/libavxemu.dylib"

      - name: Release notes
        run: |
          set -eu
          VER="${{ steps.ver.outputs.ver }}"
          sh "$SHIPYARD_SCRIPTS/release-notes.sh" --tag "$VER" --version "$VER" \
            --product AVXEmu --min-os 10.9.5 --out "$BUILD/dist/RELEASE_NOTES.md"
      - name: Record the declared state in the notes
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          digest="$(sh "$SHIPYARD_SCRIPTS/release-state.sh")"
          sh "$SHIPYARD_SCRIPTS/release-state-record.sh" --notes-file "$BUILD/dist/RELEASE_NOTES.md" --digest "$digest"
      - name: Unsigned stand-in feeds (never published)
        if: steps.ver.outputs.publish != 'yes'
        run: sh "$SHIPYARD_SCRIPTS/stand-in-feeds.sh" "$BUILD/dist" "${{ steps.ver.outputs.ver }}"

      - name: EdDSA-sign the .pkg + write avxemu.xml
        if: steps.ver.outputs.publish == 'yes'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          printenv SPARKLE_PRIVATE_KEY | grep -q . || { echo "::error::SPARKLE_PRIVATE_KEY secret not set"; exit 1; }
          VER="${{ steps.ver.outputs.ver }}"
          PKG="$BUILD/dist/avxemu-$VER.pkg"
          sh "$SHIPYARD_SCRIPTS/sign_and_appcast.sh" \
            --product avxemu --feed-dir "$BUILD/dist" \
            --channel-title AVXEmu --version "$VER" \
            --pkg-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/$VER/$(basename "$PKG")" \
            --notes-file "$BUILD/dist/RELEASE_NOTES.md" --pkg "$PKG" --min-os 10.9.5

      - name: Artifact conformance
        run: |
          sh "$SHIPYARD_SCRIPTS/artifact-facts.sh" "$BUILD/dist" "${{ steps.ver.outputs.ver }}" \
            | sh "$SHIPYARD_SCRIPTS/check-artifact-conformance.sh"

      - name: The feed is an upgrade on its line
        if: steps.ver.outputs.publish == 'yes'
        run: |
          set -eu
          sh "$SHIPYARD_SCRIPTS/assert_appcast_upgradeable.sh" --appcast "$BUILD/dist/avxemu.xml" \
            --version "${{ steps.ver.outputs.ver }}" --tag-glob '[0-9]*.[0-9]*'

      - name: The build must not have written into the source tree
        run: sh "$SHIPYARD_SCRIPTS/assert-tree-clean.sh"

      - uses: actions/upload-artifact@v7
        with:
          name: avxemu
          path: ${{ env.BUILD }}/dist/*

  scan:
    needs: [build]
    if: always() && (needs.build.outputs.publish == 'yes')
    permissions:
      actions: read
      contents: read
    uses: Mavergreen/shipyard/.github/workflows/scan-for-key.yml@v1
    with:
      artifact: avxemu
    secrets:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

  publish:
    needs: [build, scan]
    if: needs.build.outputs.publish == 'yes'
    permissions:
      contents: write
    uses: Mavergreen/shipyard/.github/workflows/publish-release.yml@v1
    with:
      version: ${{ needs.build.outputs.ver }}
      artifact: avxemu
